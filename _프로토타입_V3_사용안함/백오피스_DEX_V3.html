// EIP-55: Keccak-256, not standardized SHA3-256. No third-party or network dependency.
function keccak256(str){const M=(1n<<64n)-1n,R=[0,1,62,28,27,36,44,6,55,20,3,10,43,25,39,41,45,15,21,8,18,2,61,56,14],RC=[1n,0x8082n,0x800000000000808an,0x8000000080008000n,0x808bn,0x80000001n,0x8000000080008081n,0x8000000000008009n,0x8an,0x88n,0x80008009n,0x8000000an,0x8000808bn,0x800000000000008bn,0x8000000000008089n,0x8000000000008003n,0x8000000000008002n,0x8000000000000080n,0x800an,0x800000008000000an,0x8000000080008081n,0x8000000000008080n,0x80000001n,0x8000000080008008n];const rot=(x,r)=>r?((x<<BigInt(r))|(x>>BigInt(64-r)))&M:x;let a=Array(25).fill(0n),bytes=Array.from(str,c=>c.charCodeAt(0));bytes.push(1);while(bytes.length%136!==135)bytes.push(0);bytes.push(128);for(let o=0;o<bytes.length;o+=136){for(let i=0;i<136;i++)a[i>>3]^=BigInt(bytes[o+i])<<BigInt((i%8)*8);for(const rc of RC){let c=Array(5),d=Array(5),b=Array(25);for(let x=0;x<5;x++)c[x]=a[x]^a[x+5]^a[x+10]^a[x+15]^a[x+20];for(let x=0;x<5;x++)d[x]=c[(x+4)%5]^rot(c[(x+1)%5],1);for(let x=0;x<5;x++)for(let y=0;y<5;y++){let i=x+5*y;a[i]^=d[x];b[y+5*((2*x+3*y)%5)]=rot(a[i],R[i])}for(let x=0;x<5;x++)for(let y=0;y<5;y++)a[x+5*y]=b[x+5*y]^((~b[(x+1)%5+5*y])&b[(x+2)%5+5*y]);a[0]^=rc}}return Array.from({length:32},(_,i)=>Number((a[i>>3]>>BigInt((i%8)*8))&255n).toString(16).padStart(2,'0')).join('')}
function checksumAddress(s){let lower=s.slice(2).toLowerCase(),hash=keccak256(lower);return '0x'+Array.from(lower,(c,i)=>parseInt(hash[i],16)>=8?c.toUpperCase():c).join('')}

function calculator(){const p=pBy(state.partner),fee=state.volume*p.fee/100,back=fee*p.rate/100;return `<div class="grid">${card('예상 페이백 계산기',`<div class="formgrid"><div class="full"><label for="calcPartner">거래소</label><select id="calcPartner" data-change="calcPartner">${partnerOptions(state.partner)}</select></div><div class="full"><label for="volume">월 예상 거래량 · USD</label><input id="volume" type="number" min="${state.minVolume}" max="${state.maxVolume}" step="1000" value="${state.volume}" data-change="volume"><input aria-label="월 거래량 조절" type="range" min="${state.minVolume}" max="${state.maxVolume}" step="1000" value="${state.volume}" id="volumeRange" data-change="volume"><small>${money(state.minVolume)}–${money(state.maxVolume)} USD</small></div></div><hr class="divider">${kv('거래 수수료',money(fee)+' USD')}${kv('예상 페이백 비율',p.rate+'%')}${kv('페이백 적용 후 수수료',money(fee-back)+' USD')}<hr class="divider"><div class="muted">월 예상 페이백</div><div class="metric" style="color:var(--blue)">${money(back)} <small>USD</small></div><p class="muted">테더맥스 잔액으로 적립돼요. 출금 신청 시 연동한 ${p.type==='DEX'?'지갑':'거래 계정'}으로 지급돼요.</p>`)}${card('어디에서 거래하시나요?',`<p class="muted">거래소를 바꾸면 수수료와 예상 페이백도 함께 바뀝니다.</p>${partnerList().map(x=>`<div class="kv"><span>${esc(x.name)} ${badge(x.type)}</span>${btn('계산하기','calcPartner',x.id,'small')}</div>`).join('')}${notice('계산 결과는 예상치이며 실제 거래 조건에 따라 달라질 수 있어요.')}`)}</div><div class="demo-tag">현재 요율은 시연용 예시입니다. 운영에서는 거래소 레코드를 읽고, 별도 계산기 요율은 저장하지 않습니다.</div>`}
