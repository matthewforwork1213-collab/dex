<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TetherMax 전체 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>/*__CSS__*/
/* 프로토타입 도구 */
#pt{display:grid;grid-template-columns:280px 1fr;height:100vh}
#pt-side{background:#111318;color:#cfd3dc;overflow:auto;font-size:13px;padding-bottom:40px}
.pt-brand{padding:16px;font-weight:700;color:#fff;font-size:14px;border-bottom:1px solid #22252d}.pt-brand small{display:block;font-weight:400;color:#8b93a7;margin-top:4px}
.pt-q{margin:12px 16px;width:calc(100% - 32px);background:#1c1f27;border:1px solid #2a2e38;color:#fff;border-radius:6px;padding:8px 10px;font-size:13px}
.pt-g summary{padding:8px 16px;cursor:pointer;color:#fff;font-weight:600;list-style:none;display:flex;justify-content:space-between}.pt-g summary span{color:#6b7385;font-weight:400}
.pt-s{display:flex;justify-content:space-between;gap:8px;padding:6px 16px 6px 28px;cursor:pointer;color:#aab1c2}.pt-s:hover{background:#1a1d24;color:#fff}.pt-s.on{background:#0031c6;color:#fff}
.pt-s em{font-style:normal;font-size:11px;border-radius:8px;padding:0 6px;flex:none}.pt-s em.ok{background:#14532d;color:#86efac}.pt-s em.mid{background:#713f12;color:#fde68a}.pt-s em.no{background:#4c0519;color:#fda4af}
#pt-main{display:flex;flex-direction:column;min-width:0;height:100vh}
#pt-bar{background:#fff;border-bottom:1px solid #dde1e7;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:13px}
.pt-l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pt-l b{font-size:15px}.pt-l code{background:#f1f3f6;border-radius:4px;padding:2px 6px}.pt-fu{color:#5d6067}
.pt-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pt-r select{padding:6px 8px;border-radius:6px;border:1px solid #cfd4dc;font-size:13px;max-width:360px}
.pt-seg{display:inline-flex;background:#eef0f4;border-radius:6px;padding:2px}.pt-seg span{padding:4px 10px;border-radius:4px;cursor:pointer;color:#555}.pt-seg span.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pt-ck{display:flex;gap:4px;align-items:center;cursor:pointer}
.pt-d{width:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pt-b{font-size:12px;padding:3px 8px;border-radius:10px;font-weight:600}.pt-b.ok{background:#dcfce7;color:#166534}.pt-b.mid{background:#fef3c7;color:#92400e}.pt-b.no{background:#ffe4e6;color:#9f1239}
.pt-n{font-size:12px;color:#5d6067}
#pt-stage{flex:1;overflow:auto;background:#e9ecef;padding:24px}
.pt-frame{margin:0 auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);position:relative;overflow:hidden}
.pt-frame.vp-pc{width:1440px}.pt-frame.vp-mo{width:375px;min-height:812px}
</style></head>
<body><div id="pt"><aside id="pt-side"></aside><main id="pt-main"><div id="pt-bar"></div><div id="pt-stage"><div id="pt-frame" class="pt-frame"></div></div></main></div>
<script>/*__ASSETS__*/</script>
<script>/*__JS__*/
PT_START();</script>
</body></html>
