<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TetherMax 전체 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>/*__CSS__*/
/* 프로토타입 도구 — 화면은 실사이트처럼 전체 폭·전체 높이(결정 12차). 도구줄은 위에 고정, 화면 목록은 서랍 */
html,body{margin:0}
body{background:#fff}
#pt-bar{position:fixed;top:0;left:0;right:0;z-index:2000;background:#111318;color:#cfd3dc;padding:6px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font:12px/1.4 system-ui,-apple-system,'Malgun Gothic',sans-serif;box-shadow:0 1px 0 #22252d}
.pt-l{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}.pt-l b{font-size:13px;color:#fff}.pt-l code{background:#1c1f27;color:#cfd3dc;border-radius:4px;padding:1px 6px}.pt-fu{color:#8b93a7}
.pt-menu{background:#1c1f27;color:#fff;border:1px solid #2f3440;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
.pt-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.pt-r select{padding:4px 6px;border-radius:6px;border:1px solid #2f3440;background:#1c1f27;color:#fff;font-size:12px;max-width:340px}
.pt-seg{display:inline-flex;background:#1c1f27;border:1px solid #2f3440;border-radius:6px;padding:2px}.pt-seg span{padding:2px 8px;border-radius:4px;cursor:pointer;color:#9aa3b5}.pt-seg span.on{background:#0031c6;color:#fff;font-weight:600}
.pt-ck{display:flex;gap:4px;align-items:center;cursor:pointer}
.pt-d{width:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pt-d:empty{display:none}
.pt-b{font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600}.pt-b.ok{background:#14532d;color:#86efac}.pt-b.mid{background:#713f12;color:#fde68a}.pt-b.no{background:#4c0519;color:#fda4af}
.pt-n{font-size:11px;color:#8b93a7}
#pt-side{position:fixed;top:var(--pt-bar-h,48px);left:0;bottom:0;width:300px;z-index:1999;background:#111318;color:#cfd3dc;overflow:auto;font-size:13px;padding-bottom:40px;transform:translateX(-100%);transition:transform .28s cubic-bezier(.42,0,.58,1);box-shadow:4px 0 24px rgba(0,0,0,.3)}
body.pt-side-open #pt-side{transform:none}
.pt-brand{padding:16px;font-weight:700;color:#fff;font-size:14px;border-bottom:1px solid #22252d}.pt-brand small{display:block;font-weight:400;color:#8b93a7;margin-top:4px}
.pt-q{margin:12px 16px;width:calc(100% - 32px);background:#1c1f27;border:1px solid #2a2e38;color:#fff;border-radius:6px;padding:8px 10px;font-size:13px;box-sizing:border-box}
.pt-g summary{padding:8px 16px;cursor:pointer;color:#fff;font-weight:600;list-style:none;display:flex;justify-content:space-between}.pt-g summary span{color:#6b7385;font-weight:400}
.pt-s{display:flex;justify-content:space-between;gap:8px;padding:6px 16px 6px 28px;cursor:pointer;color:#aab1c2}.pt-s:hover{background:#1a1d24;color:#fff}.pt-s.on{background:#0031c6;color:#fff}
.pt-s em{font-style:normal;font-size:11px;border-radius:8px;padding:0 6px;flex:none}.pt-s em.ok{background:#14532d;color:#86efac}.pt-s em.mid{background:#713f12;color:#fde68a}.pt-s em.no{background:#4c0519;color:#fda4af}
#pt-stage{padding-top:var(--pt-bar-h,48px)}
.pt-frame{position:relative;background:#fff}
.pt-frame.vp-pc{width:100%;min-width:1280px}
body.pt-mo{background:#e9ecef}.pt-frame.vp-mo{width:390px;max-width:100%;margin:0 auto;min-height:calc(100vh - var(--pt-bar-h,48px));box-shadow:0 0 0 1px #cfd4dc}
/* 모달 배경막: 화면 위에 고정(실사이트처럼 보이는 화면 전체를 덮음) */
.pt-frame .scrim.pt-fixed{position:fixed;top:var(--pt-bar-h,48px);bottom:0;left:0;right:0;height:auto!important}
.pt-frame.vp-mo .scrim.pt-fixed{left:50%;right:auto;width:390px;max-width:100%;transform:translateX(-50%)}
</style></head>
<body><div id="pt"><div id="pt-bar"></div><aside id="pt-side"></aside><main id="pt-main"><div id="pt-stage"><div id="pt-frame" class="pt-frame"></div></div></main></div>
<script>/*__ASSETS__*/</script>
<script>/*__JS__*/
PT_START();</script>
</body></html>
